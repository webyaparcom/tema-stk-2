<section class="modulex-sayac-halka{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sayac-halka-ic">
    {{fbbas}}

<style>
  /* sayac-halka — stats-2 düz şerit, stats-1 ikon bandıdır; bu modül oran gösteren dairesel göstergelerdir (veri görselleştirme dili). */
  .modulex-sayac-halka { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-halka *, .modulex-sayac-halka *::before, .modulex-sayac-halka *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-halka :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-halka :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-halka :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-halka :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-halka img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-halka) img { height: auto; }
  .modulex-sayac-halka [hidden] { display: none !important; }
  .modulex-sayac-halka :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-halka :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-halka-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-halka-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-halka--bassiz .modulex-sayac-halka-bas { display: none; }
  .modulex-sayac-halka-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-halka-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-halka-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-halka-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-sayac-halka-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-halka-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-halka-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-halka-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-halka-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-halka-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-halka-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 40px 28px; }
  .modulex-sayac-halka-oge { display: grid; justify-items: center; align-content: start; gap: 10px; text-align: center; }
  .modulex-sayac-halka-halka { position: relative; display: grid; place-items: center; width: min(100%, 172px); aspect-ratio: 1; margin-block-end: 6px; }
  .modulex-sayac-halka-halka svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  [dir="rtl"] .modulex-sayac-halka-halka svg { transform: rotate(-90deg) scaleY(-1); }
  .modulex-sayac-halka-iz, .modulex-sayac-halka-dolu { fill: none; stroke-width: 8; }
  .modulex-sayac-halka-iz { stroke: --cizgi--; }
  .modulex-sayac-halka-dolu { stroke: --accent--; stroke-linecap: round; stroke-dasharray: 326.73; stroke-dashoffset: var(--o); transition: stroke-dashoffset 1.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-sayac-halka--hazir:not(.modulex-sayac-halka--gor) .modulex-sayac-halka-dolu { stroke-dashoffset: 326.73; }
  .modulex-sayac-halka-oge:hover .modulex-sayac-halka-dolu { stroke-width: 10; }
  .modulex-sayac-halka-sayi { position: relative; font-size: clamp(1.6rem, 3vw, 2.15rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .modulex-sayac-halka-ek { color: --accentInk--; font-size: 0.62em; font-weight: 700; }
  .modulex-sayac-halka-etiket { font-size: 1.05rem; font-weight: 700; line-height: 1.35; }
  .modulex-sayac-halka-not { max-width: 26ch; color: --muted--; font-size: 0.92rem; }
  @media (max-width: 768px) {
    .modulex-sayac-halka-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 16px; }
    .modulex-sayac-halka-halka { width: min(100%, 136px); }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-halka :is(.modulex-sayac-halka-baslik, .modulex-sayac-halka-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-halka-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-halka { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-halka *, .modulex-sayac-halka *::before, .modulex-sayac-halka *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-halka";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
